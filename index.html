<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos de Fútbol Diarios</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        /* Caja contenedora adaptada para móviles y ordenador */
        .widget-holder {
            width: 100%;
            height: 650px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>⚽ Partidos de Hoy</h1>

        <div class="widget-holder">
            <!-- Cartelera directa sin claves ni restricciones CORS -->
            <iframe src="https://bstream.gg"></iframe>
        </div>
    </div>

</body>
</html>
