<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel de Fútbol Personalizado</title>
    <style>
        /* Diseño 100% tuyo y modificable */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .partido-tarjeta {
            background-color: #2a2a35;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #00ff88;
        }
        .liga {
            font-size: 0.8rem;
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .equipos {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚽ Datos de Partidos (Recorridos a mi manera)</h1>
        <div id="loading">Cargando la respuesta JSON...</div>
        <div id="mis-partidos"></div>
    </div>

    <script>
        async function gestionarMisDatos() {
            const contenedor = document.getElementById('mis-partidos');
            const loading = document.getElementById('loading');

            try {
                // API 100% abierta, sin claves y compatible con GitHub Pages
                const response = await fetch('https://scorebat.com');
                
                if (!response.ok) {
                    throw new Error("Error en la respuesta del servidor");
                }
                
                const data = await response.json();
                loading.style.display = 'none';

                // Aquí tienes el array con los datos puros
                const partidos = data.response;

                // Recorremos el JSON con un bucle a tu manera
                partidos.slice(0, 20).forEach(partido => {
                    
                    // Almacenamos los datos puros en variables para que los manipules
                    const nombreLiga = partido.competition;
                    const tituloPartido = partido.title; // Da el formato "Equipo A - Equipo B"

                    // Maquetamos nuestra propia estructura HTML inyectando tus variables
                    const miTarjetaHTML = `
                        <div class="partido-tarjeta">
                            <div class="liga">${nombreLiga}</div>
                            <div class="equipos">🏃‍♂️ ${tituloPartido}</div>
                        </div>
                    `;

                    // Inyectamos la tarjeta en el contenedor
                    contenedor.innerHTML += miTarjetaHTML;
                });

            } catch (error) {
                loading.innerText = "Error leyendo el JSON de datos.";
                console.error(error);
            }
        }

        // Ejecutar el lector automático
        gestionarMisDatos();
    </script>
</body>
</html>
