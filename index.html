<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos de Fútbol Diarios</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        #current-date {
            text-align: center;
            margin: 0 0 25px 0;
            color: #6b7280;
            font-size: 1rem;
            text-transform: capitalize;
        }

        /* Contenedor dinámico nativo para evitar bloqueos del navegador */
        .football-widget-box {
            width: 100%;
            min-height: 500px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>⚽ Partidos de Hoy</h1>
        <p id="current-date"></p>

        <!-- Bloque de cartelera automatizado nativo para GitHub Pages -->
        <div class="football-widget-box">
            <div id="wg-api-football-games"
                 data-host="v3.football.api-sports.io"
                 data-key="64d981ad04d74766b497f548d7ac91d4"
                 data-date=""
                 data-league=""
                 data-season=""
                 data-theme="light"
                 data-refresh="60"
                 data-show-window="false"
                 data-show-logos="true">
            </div>
            <script type="module" src="https://api-sports.io"></script>
        </div>
    </div>

    <script>
        // Poner la fecha automáticamente en el texto superior
        const hoy = new Date();
        document.getElementById('current-date').innerText = hoy.toLocaleDateString('es-ES', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });

        // Configurar el widget dinámico con el año y fecha del día actual de forma automática
        const yyyy = hoy.getFullYear();
        const mm = String(hoy.getMonth() + 1).padStart(2, '0');
        const dd = String(hoy.getDate()).padStart(2, '0');
        const fechaFormateada = `${yyyy}-${mm}-${dd}`;
        
        document.getElementById('wg-api-football-games').setAttribute('data-date', fechaFormateada);
    </script>
</body>
</html>
