<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel de Fútbol Personalizado</title>
    <style>
        /* Aquí controlas el diseño al 100%. Cámbialo como quieras */
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .partido-tarjeta {
            background-color: #2a2a35;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #00ff88;
        }
        .liga {
            font-size: 0.8rem;
            color: #00ff88;
            font-weight: bold;
        }
        .equipos {
            font-size: 1.1rem;
            margin: 5px 0;
        }
        .marcador {
            font-weight: bold;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚽ Datos de Partidos (Recorridos a mi manera)</h1>
        <div id="loading">Cargando la respuesta JSON...</div>
        <div id="mis-partidos"></div>
    </div>

    <script>
        async function gestionarMisDatos() {
            const contenedor = document.getElementById('mis-partidos');
            const loading = document.getElementById('loading');

            try {
                // Consumimos una API deportiva de lectura libre directa (Sin bloqueos de red en GitHub)
                const response = await fetch('https://thesportsdb.com');
                const rawData = await response.json();
                
                loading.style.display = 'none';

                // AQUÍ TIENES LOS DATOS PUROS. Los gestionas como tú quieras:
                const partidos = rawData.results;

                // Recorremos el JSON a nuestra manera con un bucle
                partidos.forEach(partido => {
                    
                    // Extraemos las variables individuales que nos interesen del objeto
                    const nombreLiga = partido.strLeague;
                    const equipoLocal = partido.strHomeTeam;
                    const equipoVisitante = partido.strAwayTeam;
                    const golesLocal = partido.intHomeScore !== null ? partido.intHomeScore : '-';
                    const golesVisitante = partido.intAwayScore !== null ? partido.intAwayScore : '-';

                    // Maquetamos nuestra propia estructura HTML inyectando los datos
                    const miTarjetaHTML = `
                        <div class="partido-tarjeta">
                            <div class="liga">${nombreLiga}</div>
                            <div class="equipos">
                                🏠 ${equipoLocal} <span class="marcador">${golesLocal}</span> 
                                vs 
                                ${equipoVisitante} <span class="marcador">${golesVisitante}</span> 🚌
                            </div>
                        </div>
                    `;

                    // Lo añadimos a la pantalla
                    contenedor.innerHTML += miTarjetaHTML;
                });

            } catch (error) {
                loading.innerText = "Error leyendo el JSON de datos.";
                console.error(error);
            }
        }

        // Ejecutar la lectura
        gestionarMisDatos();
    </script>
</body>
</html>
