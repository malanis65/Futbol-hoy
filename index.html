<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel de Fútbol Personalizado</title>
    <style>
        /* Diseño 100% tuyo y modificable */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .partido-tarjeta {
            background-color: #2a2a35;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #00ff88;
        }
        .liga {
            font-size: 0.8rem;
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .equipos {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚽ Datos de Partidos (Recorridos a mi manera)</h1>
        <div id="loading">Cargando la respuesta JSON...</div>
        <div id="mis-partidos"></div>
    </div>

    <script>
        document.getElementById('current-date');

        async function gestionarMisDatos() {
            const contenedor = document.getElementById('mis-partidos');
            const loading = document.getElementById('loading');

            try {
                // Servidor de datos de prueba libre de bloqueos CORS y 100% estable para desarrollo
                const response = await fetch('https://typicode.com');
                
                if (!response.ok) {
                    throw new Error("Error en la respuesta del servidor");
                }
                
                const datosJson = await response.json();
                loading.style.display = 'none';

                // SIMULACIÓN DE DATOS REALES: Convertimos el JSON para que puedas programar tus objetos futbolísticos
                const partidosSimulados = datosJson.slice(0, 10).map((item, index) => {
                    const equiposEjemplo = [
                        { liga: "LaLiga", local: "Real Madrid", visitante: "Barcelona" },
                        { liga: "LaLiga", local: "Atlético de Madrid", visitante: "Sevilla" },
                        { liga: "Premier League", local: "Manchester City", visitante: "Arsenal" },
                        { liga: "Premier League", local: "Liverpool", visitante: "Chelsea" },
                        { liga: "Champions League", local: "Bayern Múnich", visitante: "PSG" },
                        { liga: "Champions League", local: "Juventus", visitante: "Real Betis" },
                        { liga: "Serie A", local: "Inter de Milán", visitante: "AC Milan" },
                        { liga: "LaLiga", local: "Valencia CF", visitante: "Real Sociedad" },
                        { liga: "Bundesliga", local: "Dortmund", visitante: "Leipzig" },
                        { liga: "Ligue 1", local: "Mónaco", visitante: "Marsella" }
                    ];
                    return equiposEjemplo[index];
                });

                // AQUÍ EMPIEZA TU GESTIÓN: Recorremos el array final con tu propio bucle forEach
                partidosSimulados.forEach(partido => {
                    
                    // Extraes los valores del JSON puro a tus propias variables
                    const nombreLiga = partido.liga;
                    const local = partido.local;
                    const visitante = partido.visitante;

                    // Creas la estructura HTML que te dé la gana metiendo tus datos
                    const miTarjetaHTML = `
                        <div class="partido-tarjeta">
                            <div class="liga">🏆 ${nombreLiga}</div>
                            <div class="equipos">🏠 ${local} vs ${visitante} 🚌</div>
                        </div>
                    `;

                    // Lo pintas en la pantalla
                    contenedor.innerHTML += miTarjetaHTML;
                });

            } catch (error) {
                loading.innerText = "Error leyendo el JSON de datos.";
                console.error(error);
            }
        }

        // Ejecutar el cargador
        gestionarMisDatos();
    </script>
</body>
</html>
