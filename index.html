<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidos de Fútbol Diarios</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 1.8rem;
            margin-bottom: 25px;
        }

        /* Contenedor adaptativo optimizado para GitHub Pages */
        .scorebat-widget-container {
            width: 100%;
            min-height: 500px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>⚽ Partidos de Hoy</h1>

        <!-- Widget libre de bloqueos CORS y automatizado por script -->
        <div class="scorebat-widget-container">
            <iframe src="https://scorebat.com" 
                    width="100%" 
                    height="600" 
                    style="border:none;" 
                    allow="autoplay; fullscreen" 
                    class="_scorebatEmbeddedPlayer_">
            </iframe>
        </div>
    </div>

</body>
</html>
